# =============================================================================
# sage-kahoot-web — manifests de deploy no cluster interno
#
# Aplicar:
#   kubectl -n {{NAMESPACE_K8S}} apply -f deploy/k8s/k8sdeploy.yml
#
# Não há Secret: o bundle de um SPA é público por definição e nada sensível entra
# nele. A credencial do apresentador vive apenas no Secret da sage-kahoot-api.
#
# PENDENTE — confirmar com a infraestrutura antes do primeiro deploy:
#   classe do Ingress, anotações obrigatórias e TLS interno (mesmas pendências
#   registradas no deploy da sage-kahoot-api).
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sage-kahoot-web-config
  namespace: "{{NAMESPACE_K8S}}"
  labels:
    app.kubernetes.io/name: sage-kahoot-web
    app.kubernetes.io/part-of: sage-kahoot
data:
  # Origem da API. Precisa bater com Cors__AllowedOrigins__0 do lado da API — lá a origem
  # autorizada é a deste frontend; aqui é o destino das chamadas REST e do hub SignalR.
  API_BASE_URL: "https://sage-kahoot-api.{{DOMINIO_INTERNO}}"
  # Endereço exibido no telão para o participante entrar. Vazio = origem do próprio frontend.
  JOIN_URL_BASE: "https://sage-kahoot.{{DOMINIO_INTERNO}}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-kahoot-web
  namespace: "{{NAMESPACE_K8S}}"
  labels:
    app.kubernetes.io/name: sage-kahoot-web
    app.kubernetes.io/part-of: sage-kahoot
spec:
  # Conteúdo estático, sem estado: pode escalar horizontalmente a qualquer momento — a restrição de
  # instância única é da API, que hospeda o hub, não daqui. Fica em 1 porque a escala é modesta
  # (dezenas de participantes por sessão) e o ambiente de desenvolvimento roda com uma só; subir
  # para 2 ou mais é decisão de infraestrutura, sem impacto na aplicação.
  # Mesmo com 1 réplica o rollout não derruba o serviço: o padrão de maxUnavailable (25%) arredonda
  # para 0 e o de maxSurge arredonda para 1, então o pod novo sobe antes de o antigo sair.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: sage-kahoot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sage-kahoot-web
    spec:
      securityContext:
        runAsNonRoot: true
        # Explícito e numérico: é o uid do usuário nginx na imagem base. Sem ele, a verificação de
        # não-root depende do USER da imagem ser numérico.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{REGISTRY_IMAGENS}}/sage-kahoot-web:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sage-kahoot-web-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # Servir arquivo estático custa pouco.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # Com a raiz somente leitura, o nginx precisa de destinos graváveis: o config.js de
            # runtime e os temporários vão para /tmp; a conf renderizada do template, para conf.d.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sage-kahoot-web
  namespace: "{{NAMESPACE_K8S}}"
  labels:
    app.kubernetes.io/name: sage-kahoot-web
spec:
  # ClusterIP: sem exposição pública. O acesso vem do Ingress interno ou de port-forward.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sage-kahoot-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sage-kahoot-web
  namespace: "{{NAMESPACE_K8S}}"
  labels:
    app.kubernetes.io/name: sage-kahoot-web
spec:
  ingressClassName: nginx-internal
  rules:
    - host: "sage-kahoot.{{DOMINIO_INTERNO}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sage-kahoot-web
                port:
                  name: http
