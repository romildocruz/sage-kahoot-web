schema: spec-driven

context: |
  sage-kahoot-web — frontend do quiz gamificado interno de uma empresa (uso interno, sem exposição pública).

  Stack: React 19 + Vite + TypeScript, TanStack Query, React Router, @microsoft/signalr.
  Client REST tipado gerado do contrato da API (openapi-typescript + openapi-fetch) — o arquivo
  src/api/generated/schema.ts é gerado por `npm run api:types` e não é editado à mão.

  Backend: sage-kahoot-api (.NET 10 + FastEndpoints + MongoDB), repositório separado, com seu próprio
  openspec. O contrato REST é o openapi.json na raiz deste projeto; o contrato do hub SignalR não
  aparece no OpenAPI e está descrito na capability realtime-client.

  Superfícies: participante (rota raiz, anônimo por PIN + apelido, mobile-first), apresentador
  (/admin, login com credencial única) e telão (/admin/sessions/:id, projetor).

  Convenções: camadas componente -> hook -> endpoint -> client tipado; nenhum fetch em componente;
  acesso ao hub só pela camada de tempo real; textos e specs em português do Brasil; sem dados
  pessoais reais em exemplos (apelidos sintéticos); sem credencial no frontend.

